name: Build and release plugin

on:
  push:
    tags:
      - "v*"

env:
  PLUGIN_NAME: logseq-async-task-timer

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Check release version and notes
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          assert.equal(tag, `v${pkg.version}`, 'Tag must match package.json version');
          const notes = readFileSync(`docs/releases/${tag}.md`, 'utf8');
          assert.ok(notes.startsWith(`# ${tag} —`), 'Release notes must identify this version');
          assert.ok(pkg.supportsDBOnly && pkg.logseq.supportsDBOnly, 'This release requires DB-only metadata');
          JS
      - name: Build
        run: |
          npm ci
          npm test
          npm run build
          mkdir "$PLUGIN_NAME"
          cp README.md package.json icon.png logo.svg LICENSE "$PLUGIN_NAME/"
          cp -R vendor dist "$PLUGIN_NAME/"
          cp "docs/releases/${GITHUB_REF_NAME}.md" "$PLUGIN_NAME/RELEASE_NOTES.md"
          mkdir -p "$PLUGIN_NAME/docs/releases"
          cp "docs/releases/${GITHUB_REF_NAME}.md" "$PLUGIN_NAME/docs/releases/"
          zip -r "${PLUGIN_NAME}-${GITHUB_REF_NAME}.zip" "$PLUGIN_NAME"
      - name: Publish release with notes and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          title="$(sed -n '1s/^# //p' "$notes")"
          archive="${PLUGIN_NAME}-${GITHUB_REF_NAME}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" package.json --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file "$notes" --draft=false --latest
          else
            gh release create "$GITHUB_REF_NAME" "$archive" package.json \
              --verify-tag --title "$title" --notes-file "$notes" --latest
          fi
